}

/* =====================================================================
   推送预览
   ===================================================================== */

function viewPreview() {
  const p = S.preview;
  // ⚠️ 刻意**不给 max**：用户想看多远自己填，上限在服务端 clampDays 兜
  //   （Trakt 单次只返回 33 天，更远由 computeWindows 分片拉）。
  //   原来这里是写死 3/7/14/30/33 的下拉 —— 想看 45 天就得改代码。
  const dayBox = (labelKey, bind, value) =>
    '<label class="day-box"><span>' + esc(t(labelKey)) + '</span>' +
      '<input class="inp" type="number" min="0" step="1" inputmode="numeric" data-bind="' + bind + '" value="' + value + '">' +
      '<span class="mono">' + esc(t('pv.daysUnit')) + '</span></label>';

  // ⚠️ 刻意**不自动重算**：每敲一个数字就干跑一次预览，既吵又挡着继续改另一个框。
  //   窗口没动过的时候，「重新计算」**直接消失** —— 没有什么要重算的，
  //   顶上摆一个永远可点的按钮只会让人以为预览已经不准了。
  //   （想强制刷新用「立即检查一次」，它跑完真实一轮并顺带刷新这份预览。）
  const windowDirty = previewWindowDirty();
  const right = '<div class="row">' +
      dayBox('pv.lookback', 'previewLookback', S.previewLookback) +
      dayBox('pv.horizon', 'previewDays', S.previewDays) +
      // 按钮**始终留在 DOM 里**（干净时 hidden）：这样"改一个数字"只需切一个属性，
      //   不用在事件里现造/删节点 —— 后者迟早漏掉重置状态的分支。
      // 待生效的提示 = 按钮本身现身 + 主按钮态 + 那个小圆点（`.p` 驱动，见 .btn .dot）。
      '<button class="btn' + (windowDirty ? ' p' : '') + '" id="pvRecalc" data-act="preview-run"' +
        (windowDirty ? '' : ' hidden') + (S.busy.preview ? ' disabled' : '') + '>' +
        (S.busy.preview ? '<span class="spin"></span> ' : '<span class="dot"></span>↻ ') + esc(t('pv.recalculate')) + '</button>' +
      '<button class="btn p" data-act="run-now"' + (S.busy.runNow ? ' disabled' : '') + '>' +
        (S.busy.runNow ? '<span class="spin"></span> ' + esc(t('dash.running')) : '⚡ ' + esc(t('dash.quickCheck'))) + '</button>' +
    '</div>';

  let body;
  if (!p) {
    body = '<div class="card"><div class="empty"><span class="spin"></span> ' + esc(t('c.loading')) + '…</div></div>';
  } else {
    const c = p.counts || {};
    const planned = p.planned || [];
    const skipped = p.skipped || [];
    const noChannel = S.channels.filter(function (x) { return x.enabled; }).length === 0;

    const skippedByCode = {};
    for (const s of skipped) {
      skippedByCode[s.code] = skippedByCode[s.code] || [];
      skippedByCode[s.code].push(s);
    }
    const order = Object.keys(skippedByCode).sort(function (a, b) { return skippedByCode[b].length - skippedByCode[a].length; });

    body = '' +
      (noChannel ? '<div class="note warn"><span class="n-ico">📭</span><div>' + esc(t('pv.noChannels')) + '</div></div>' : '') +
      (S.lastRun ? '<div class="note ' + (S.lastRun.ok ? 'ok' : 'warn') + '"><span class="n-ico">' + (S.lastRun.ok ? '✓' : '⚠️') + '</span><div>' + esc(S.lastRun.text) + '</div></div>' : '') +

      '<div class="grid g4" style="margin-bottom:16px">' +
        stat(c.due || 0, t('pv.due')) +
        stat(c.upcoming || 0, t('pv.upcoming')) +
        stat(c.skipped || 0, t('pv.skipped')) +
        stat(c.fetchedItems || 0, t('pv.fetched')) +
      '</div>' +

      '<div class="card"><div class="card-h"><span class="ico">🕒</span><h2>' + esc(t('pv.timeline')) + '</h2>' +
        '<div class="spacer"></div>' +
        // 回显**服务端真正用的**两侧窗口（不是输入框里的值 —— 被夹过的话要看得出来）
        '<span class="chip">' + esc(t('pv.lookback') + ' ' + p.lookbackDays + ' ' + t('pv.daysUnit')) + '</span>' +
        '<span class="chip">' + esc(t('pv.horizon') + ' ' + p.horizonDays + ' ' + t('pv.daysUnit')) + '</span>' +
        '<span class="chip">' + esc(fmtDateTime(new Date(p.simulatedAt))) + '</span>' +
      '</div>' +
      (planned.length
        ? '<div class="card-b" style="padding-top:4px"><div class="tl">' + timelineHtml(planned) + '</div></div>'
        : '<div class="empty"><span class="ico">🕳️</span>' + esc(t('pv.empty')) + '</div>') +
      '</div>' +

      (skipped.length ? '<div class="card"><div class="card-h"><span class="ico">🚫</span><h2>' + esc(t('pv.skippedTitle')) + '</h2>' +
        '<div class="spacer"></div><span class="chip">' + skipped.length + '</span></div>' +
        // ⚠️ 刻意不给这段说明（2026-10-05 用户要求）：它在解释"为什么会有这个区块"，
        //   属于自述；区块标题已经写了"被过滤的内容"，下面的分组标题也直接写着原因。
        '<div class="card-b">' +
        order.map(function (code) { return skippedGroupHtml(code, skippedByCode[code]); }).join('') +
        '</div></div>' : '');
  }

  // 副标题刻意不给：原来那句「干跑：只计算不发送、不写库」是**实现机制**，
  // 用户在预览页要的是"什么时候会推给我"，不是"这页会不会写库"。
  return pageHead('pv.title', '', right) + body;
}

/**
 * 被过滤列表里的一组（同一个 skip code）。
 *
 * ## 为什么行内不重复写原因
 *
 * `<summary>` 已经把 `skipLabel(code, sample[0])` 写成了组标题 ——
 * 而条目是**按 code 分组**的，组内每一条的原因必然是同一句。
 * 所以行内再写一遍就是截图里那样：36 条内容下面挂着 36 句一模一样的话。
 *
 * 那为什么当初要写？因为 `detail` 是**逐条不同**的，比如
 * `not_selected` 带 `kind: 'theatrical' | 'homeRelease'`（电影那组要区分首映/上线）。
 * 分组标题只能用第一条的 detail 填，于是组内其余条目就填错了。
 *
 * 所以规则是：**行内只在"这一行算出来的文案与组标题不同"时才显示**——
 * 那通常正是 detail 不同造成的（少数派），显示出来才有信息量；
 * 相同的一律不显示（多数派）。
 */
function skippedGroupHtml(code, items) {
  const sample = items.slice(0, 30);
  const groupLabel = skipLabel(code, sample[0]);
  /*
   * 整段结构**与上方时间轴一模一样**（用户 2026-10-05 要求）：共用 `dayGroupsHtml`，
   * 所以日期标题、按天分组、相对时间 pill、行的排版全都一致 —— 连"哪天"都由日期标题
   * 逐天给出，不再在组标题上写一个跨天的区间（那个既冗余又与分组的写法冲突）。
   *
   * ⚠️ 被过滤的条目**没有推送时刻**（它们压根没被排进计划），所以这里的时间与药丸给的是
   *   **播出时刻** `firstAired`，不是 `notifyAt` —— 两者在这条路径上不是一回事，别混用。
   * ⚠️ 这里**不挂** 🎬/▶ 的 chip：同一个符号在每行重复，零信息量 ——
   *   海报缺图时已经用它占位，而剧集那支还有 S01E06、电影那支没有。
   */
  /*
   * ⚠️ 缺 `firstAired` 的条目**直接剔除**，不硬渲染：
   *   没有播出时刻就没法归日，而 `Intl.DateTimeFormat.format(Invalid Date)` 会**抛异常**
   *   （不是返回 "Invalid Date"，是抛）—— 那会把整个预览页炸掉。
   *   真实数据里 `CalendarItem.firstAired` 是必填 Date，服务端也会 `toISOString()`，
   *   所以这是纯防御；但注释要写清"为什么过滤而不是兜一个默认时间"。
   */
  const usable = sample.filter(function (s) {
    return s.firstAired && !Number.isNaN(new Date(s.firstAired).getTime());
  });
  const rows = dayGroupsHtml(
    usable,
    function (s) { return new Date(s.firstAired); },
    function (s, at) {
      const ep = s.mediaType === 'movie'
        ? ''
        : '<span class="mono" style="color:var(--text-3)"> S' + pad2(s.season) + 'E' + pad2(s.episode) + '</span>';
      const why = skipReasonText(s);
      // 与组标题一致 ⇒ 不显示（重复），不一致 ⇒ 才显示（那才是这条特有的信息）
      const extra = why && why !== groupLabel ? '<div class="m">' + esc(why) + '</div>' : '';
      /*
       * ⚠️ 单集标题与播出时间要和**时间轴**保持一致。
       *   这两行不是装饰，是**判断依据**：知道"是哪一集、什么时候播"才说得清
       *   "为什么它该被推却没推"。少了它们，被过滤的条目只剩一个片名，
       *   认不出是哪一集 —— 同一部剧漏掉 S01E06 与漏掉 S01E12 是完全不同的问题。
       *   数据本来就有（`DryRunSkipEntry` 带 `episodeTitle` 与 `firstAired`），
       *   时间轴那边是服务端 `buildBody` 拼的，被过滤这边之前压根没渲染。
       */
      const detail = [];
      if (s.mediaType !== 'movie' && s.episodeTitle) detail.push(s.episodeTitle);
      // 播出时刻：**不带「播出：」前缀，也不带年份**（2026-10-05 用户要求）。
      // 与时间轴的 buildBody 保持一致 —— 两处同源同格式，不给界面两种说法。
      if (s.firstAired) detail.push(esc(fmtAirAt(at)));
      return '<div class="tl-item">' +
        posterHtml(s.posterUrl, s.mediaType === 'movie', '', traktUrlFromItemKey(s.itemKey), s.showTitle,
          fmtTime(at)) +
        '<div class="tl-main">' +
          '<div class="t">' + esc(s.showTitle) + ep + '</div>' +
          (detail.length ? '<div class="m">' + detail.join('<br>') + '</div>' : '') +
          extra +
        '</div>' +
      '</div>';
    },
  );

  /*
   * ⚠️ 组标题只留「原因 + 条数」，**不再列规则名**（2026-10-05 用户要求）：
   *   原因相同的条目可能来自多条规则，把规则名摊在这里既挤又答非所问
   *   （这一栏回答的是"为什么没推"，规则名是另一件事）。
   *   要看某条规则命中了什么，去规则页或推送预览的时间轴。
   */
  return '<details style="border-top:1px solid var(--border);padding:10px 0">' +
    '<summary><b style="color:var(--text)">' + esc(groupLabel) + '</b> ' +
    '<span class="chip">' + items.length + '</span></summary>' +
    rows +
    (items.length > sample.length ? '<div class="desc" style="padding:8px 2px">+ ' + (items.length - sample.length) + '</div>' : '') +
    '</details>';
}

/**
 * 分组标题的文案。
 *
 * ⚠️ `outside_lookback` 的文案里带占位符（{{lookbackDays}} 天），
 * 而标题只拿到一个 code、没有 detail —— 直接 `t(key)` 会把占位符原样打出来
 * （界面上就是「已错过补发窗口（{{lookbackDays}} 天）」）。
 *
 * 所以这里用**该组第一条**的 detail 来填。同一分组里的条目必然同因、
 * 那个数值（过去天数）对整组是一样的 —— 逐条各填各的反而更啰嗦。
 *
 * ⚠️ `kind` 是唯一的例外（电影那组首映/影碟不同），所以行内会比对一次：
 * 与组标题一致的就不重复显示，不一致的才显示（见 `skippedGroupHtml`）。
 *
 * @param sample 该分组的第一条（没有就退化成只出文案名）
 */
function skipLabel(code, sample) {
  const key = 'skip.' + code;
  const v = t(key);
  if (v === key) return code;
  return fillSkipDetail(v, sample && sample.detail);
}

/**
 * 条目级别的说明：永远带自己的 detail（每条可能不同）。
 *
 * 与 `skipLabel` 共用 `fillSkipDetail` —— 两处各写一遍替换循环的话，
 * 改一边忘了另一边就会留下 `{{kind}}` 这样的字面量。
 */
function skipReasonText(s) {
  const key = 'skip.' + s.code;
  const v = I18N['zh-CN'][key] ? t(key) : s.code;
  return fillSkipDetail(v, s.detail);
}

/**
 * 把detail 里的占位符填进文案。
 *
 * ## 为什么要两步（填 + 清理）
 *
 * ① 只填**文案里真的出现**的占位符 —— detail 可能带着文案用不到的字段
 *    （`not_selected` 的剧集分支没有 `kind`，电影分支才有）。
 * ② **填完必须清理残留的 `{{...}}`** —— 否则 detail 缺某个字段时，
 *    界面上会出现字面量 `{{kind}}`（实测：给文案加占位符后，剧集组立刻现形）。
 *
 * ⚠️ 第② 步是踩过的坑：**加占位符时不能只看"填得上"的那条分支**——
 * 另一条分支没有那个字段，残留会直接打到用户脸上。
 */
function fillSkipDetail(text, detail) {
  let out = String(text);
  if (detail) {
    for (const k in detail) {
      const ph = '{{' + k + '}}';
      if (!out.includes(ph)) continue;
      out = out.split(ph).join(skipDetailValue(k, detail[k]));
    }
  }
  // 没被填上的占位符（detail 里没有对应字段）直接去掉。
  // 宁可用一条短一点的句子，也不要把 `{{kind}}` 这种毛坯印给用户。
  return out.replace(/\s*\{\{[a-zA-Z0-9_]+\}\}/g, '').trim();
}

/**
 * detail 值的可读化。
 *
 * `kind` 是**选项 key**（`theatrical` / `homeRelease`），直接印出来用户看不懂，
 * 所以复用 `opt.movies.*` 的既有文案 —— 不另造一套译法，也不会四语对不齐。
 * 没有对应文案时退回原值（宁可显示 `theatrical`，也不要空着）。
 */
function skipDetailValue(key, value) {
  if (key === 'kind') {
    const optKey = 'opt.movies.' + value;
    return I18N['zh-CN'][optKey] ? t(optKey) : String(value);
  }
  return String(value);
}

/* =====================================================================
   投递日志
   ===================================================================== */

function viewLogs() {
  const h = S.logHealth;
  const right = '<div class="row">' +
      '<div class="seg" id="logFilter">' +
        ['all', 'sent', 'failed', 'pending', 'sending'].map(function (s) {
          return '<button data-act="log-filter" data-val="' + s + '" class="' + (S.logStatus === s ? 'on' : '') + '">' + esc(t('log.' + s)) + '</button>';
        }).join('') +

      '<button class="btn" data-act="logs-load">↻ ' + esc(t('c.refresh')) + '</button>' +

      '<span class="chip ' + (h.ok ? 'ok' : 'bad') + '">' + esc(h.ok ? t('log.healthOk') : t('log.healthBad')) + '</span>' +
    '</div><div class="card-b">' +
      (h.problems && h.problems.length
        ? '<div class="note bad"><span class="n-ico">⚠️</span><div><b>' + esc(t('log.problems')) + '</b>' +
          h.problems.map(function (p) { return '<br>· ' + esc(p); }).join('') + '</div></div>' : '') +
      '<div class="kv"><span class="k">' + esc(t('log.lastTick')) + '</span><span class="v">' + esc(relTime(h.lastTickAt)) +
        (h.lastTickStats ? ' <span class="chip">sent ' + h.lastTickStats.sent + ' / failed ' + h.lastTickStats.failed + '</span>' : '') + '</span></div>' +
      '<div class="kv"><span class="k">' + esc(t('log.pendingCount')) + '</span><span class="v">' + esc(h.pendingDeliveries) + '</span></div>' +
      '<div class="kv"><span class="k">' + esc(t('log.lock')) + '</span><span class="v">' +
        (h.lock && !h.lock.expired
          ? '<span class="chip warn">' + esc(t('log.lockHeld', { owner: h.lock.owner, when: fmtDateTime(new Date(h.lock.expiresAt)) })) + '</span>'
          : '<span class="chip ok">' + esc(t('log.lockFree')) + '</span>') + '</span></div>' +
      /*
       * ⚠️ 这一页只回答用户真正会问的"我的通知发出去了吗"，**不显示调度信息**：
       * 怎么调度是管理员的事（管理控制台「自动调度」卡里有端点、驱动、CRON_SECRET）。
       * 两处重复只会让人以为两边说法不同。
       */
      '<div class="row"><button class="btn sm ghost" data-act="logs-prune">' + esc(t('log.prune')) + '</button></div>' +
    '</div></div>' : '';

  const items = (S.logs && S.logs.deliveries) || [];
  const rows = items.map(function (d) {
    return '<tr>' +
      '<td style="white-space:nowrap"><b>' + esc(fmtTime(new Date(d.notifyAt))) + '</b><br>' +
        '<span style="color:var(--text-3);font-size:11px">' + esc(fmtDay(new Date(d.notifyAt))) + '</span></td>' +
      '<td><div style="display:flex;gap:11px;align-items:flex-start">' +
        posterHtml(d.posterUrl, isMovieKey(d.itemKey), 'md', traktUrlFromItemKey(d.itemKey), d.title) +
        '<div style="min-width:0"><div style="font-weight:560">' + esc(d.title) + '</div>' +
        '<div style="color:var(--text-3);font-size:11.5px;white-space:pre-line">' + esc(d.body || '') + '</div>' +
        // 只有非成功状态才显示错误栏：成功条目不该挂 last_error，
        // 否则会显示成"成功的投递下面一行红色报错"。
        (d.status !== 'sent' && d.lastError ? '<span class="err">' + esc(d.lastError) + '</span>' : '') + '</div></div></td>' +
      '<td class="mono" style="white-space:nowrap">' + esc(channelName(d.channelId)) + '</td>' +
      '<td>' + statusChip(d.status) + '</td>' +
      '<td style="text-align:center">' + esc(d.attempts) + '</td>' +
      '<td style="white-space:nowrap;font-size:11px;color:var(--text-3)">' +
        (d.sentAt ? esc(relTime(d.sentAt)) : (d.nextRetryAt ? esc(fmtTime(new Date(d.nextRetryAt))) : '—')) + '</td>' +
      '<td>' + (d.status === 'sent' ? '' : '<button class="btn sm" data-act="log-retry" data-id="' + esc(d.id) + '">' + esc(t('log.retry')) + '</button>') + '</td>' +
    '</tr>';
  }).join('');

  const table = items.length
    ? '<div style="overflow-x:auto"><table><thead><tr>' +
        '<th>' + esc(t('log.time')) + '</th><th>' + esc(t('log.message')) + '</th>' +
        '<th>' + esc(t('log.channel')) + '</th><th>' + esc(t('log.status')) + '</th>' +
        '<th style="text-align:center">' + esc(t('log.tries')) + '</th>' +
        '<th>' + esc(t('log.nextTry')) + '</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
    : '<div class="empty"><span class="ico">📜</span>' + esc(t('log.empty')) + '</div>';

  return pageHead('log.title', 'log.subtitle', right) + healthCard +
    '<div class="card">' + table + '</div>';
}

function channelName(id) {
  const c = S.channels.find(function (x) { return x.id === id; });
  return c ? (c.name || c.type) : (id ? id.slice(0, 8) : '—');
}

function statusChip(s) {
  const map = { sent: 'ok', failed: 'bad', pending: '', sending: 'warn' };
  return '<span class="chip ' + (map[s] || '') + '">' + esc(t('st.' + s) || s) + '</span>';
}

   ===================================================================== */

/**
 * 时区下拉的候选项。
 *
 * 为什么是**固定清单**而不是让用户手输 IANA 名称：
 *   手输 `Asia/Shangai`（少个 h）拼错时，**校验会拦住**（`isValidTzClient` 走
 *   `Intl.DateTimeFormat`，错名抛异常）—— 但用户看到的是一句"无法识别"，
 *   不知道自己错在哪。给个下拉，错的可能**直接消失**。
 *   代价是清单外的时区选不到，所以要覆盖到"某人真的住在那里"的量级。
 *
 * ⚠️ 清单里**不要加已废弃的别名**（`Asia/Chongqing`、`US/Eastern` 之类）——
 *   它们在 IANA 里仍被接受，但同一地会出现两项，用户会以为是两个地方。
 *
 * 顺序按 UTC 偏移分大区，偏移相近的排在一起 —— 用户是按"我在哪儿"找的，
 * 不是按字母序。`offsetLabel` 是给**用户看的本地化文案**，进的是 i18n 字典；
 * `value` 必须是 IANA 真名（一律 ASCII，不本地化）。
 */
const COMMON_ZONES = [
  // —— utc ——
  { value: 'UTC', group: 'tzGroup.utc' },

  { value: 'Asia/Ho_Chi_Minh', group: 'tzGroup.asia' },
  { value: 'Asia/Jakarta', group: 'tzGroup.asia' },
  { value: 'Asia/Hong_Kong', group: 'tzGroup.asia' },
  { value: 'Asia/Shanghai', group: 'tzGroup.asia' },
  { value: 'Asia/Singapore', group: 'tzGroup.asia' },
  { value: 'Asia/Taipei', group: 'tzGroup.asia' },
  { value: 'Asia/Seoul', group: 'tzGroup.asia' },
  { value: 'Asia/Tokyo', group: 'tzGroup.asia' },
  // —— europe ——
  { value: 'Atlantic/Azores', group: 'tzGroup.europe' },
  { value: 'Atlantic/Reykjavik', group: 'tzGroup.europe' },
  { value: 'Europe/London', group: 'tzGroup.europe' },
  { value: 'Europe/Amsterdam', group: 'tzGroup.europe' },
  { value: 'Europe/Berlin', group: 'tzGroup.europe' },
  { value: 'Europe/Madrid', group: 'tzGroup.europe' },
  { value: 'Europe/Paris', group: 'tzGroup.europe' },
  { value: 'Europe/Rome', group: 'tzGroup.europe' },
  { value: 'Europe/Stockholm', group: 'tzGroup.europe' },
  { value: 'Europe/Warsaw', group: 'tzGroup.europe' },
  { value: 'Europe/Kyiv', group: 'tzGroup.europe' },
  { value: 'Europe/Istanbul', group: 'tzGroup.europe' },
  { value: 'Europe/Moscow', group: 'tzGroup.europe' },
  // —— africa ——
  { value: 'Africa/Lagos', group: 'tzGroup.africa' },
  { value: 'Africa/Cairo', group: 'tzGroup.africa' },
  { value: 'Africa/Johannesburg', group: 'tzGroup.africa' },
  { value: 'Africa/Nairobi', group: 'tzGroup.africa' },
  // —— america ——
  { value: 'America/Anchorage', group: 'tzGroup.america' },

/** 候选项的本地化显示名：`<i18n key> → 城市/地区名`，键为 `tz.<IANA 名称>` */
function tzOptionLabel(value) {
  const local = t('tz.' + value);
  // i18n 缺这一项时原样显示 IANA 名 —— 那仍比空串好（用户至少认得出）
  return local === 'tz.' + value ? value : local;
}

/**
 * 时区下拉的 HTML（`<optgroup>` 按大区分组，分组名也本地化）
 *
 * ⚠️ `selected` 不在清单里时（自定义或已废弃的别名），
 *   **必须补一项**。否则 `<select>` 会退回显示第一项（UTC）而**不选中任何 option**
 *   —— 用户一进设置页看到的就是 UTC，一按保存，**他的时区被静默改掉了**。
 *   这种情况没法"猜"他想要哪个时区（`Europe/Kiev` 与 `Europe/Kyiv` 偏移一样但
 *   名字不同），所以原样列出、标明它不在清单里，让用户自己选。
 */
function timezoneOptionsHtml(selected) {
  const out = []
  let curGroup = null
  for (const z of COMMON_ZONES) {
    if (z.group !== curGroup) {
      if (curGroup !== null) out.push('</optgroup>')
      curGroup = z.group
      out.push('<optgroup label="' + esc(t(z.group)) + '">')
    }
    out.push(
      '<option value="' + esc(z.value) + '"' + (z.value === selected ? ' selected' : '') + '>' +
        esc(tzOptionLabel(z.value)) + '</option>',
    )
  }
  if (curGroup !== null) out.push('</optgroup>')

  const known = COMMON_ZONES.some(function (z) { return z.value === selected })
  if (selected && !known) {
    out.push(
      '<optgroup label="' + esc(t('tzGroup.other')) + '">' +

    )
  }
  return out.join('')
}

/* =====================================================================
   管理控制台（#/admin）
   ---------------------------------------------------------------------
   这是**实例级**的页面，不是某个用户的后台。它与用户会话完全分开：
   凭据是 /api/admin/login 用 ADMIN_SECRET 换来的 tn_admin cookie。
   所以它不需要先登录 Trakt，未登录的用户也能打开（会看到登录框）。

   界面上刻意不显示任何用户的数据内容 —— 只有"这个账号健不健康"。
   服务端也不会给（见 routes/admin.ts 的说明），两边一致。
   ===================================================================== */

function viewAdmin() {
  const a = S.admin;

  if (!a || !a.authenticated) {
    return '' +
      '<main><div style="max-width:480px;margin:48px auto">' +
        '<div class="card"><div class="card-h"><span class="ico">🛠️</span><h2>' + esc(t('admin.title')) + '</h2></div>' +
        '<div class="card-b">' +
          '<label class="field"><span class="lb">' + esc(t('admin.secretLabel')) + '</span>' +
            '<input class="inp" type="password" data-bind="adminSecretInput" autocomplete="current-password" ' +
              'value="' + esc(S.adminSecretInput) + '" placeholder="' + esc(t('admin.secretPh')) + '">' +
          '</label>' +
          '<button class="btn p" style="width:100%;justify-content:center" data-act="admin-login">' +
            esc(S.adminBusy.login ? t('c.loading') : t('admin.login')) + '</button>' +
          (S.authError ? '<div class="note bad" style="margin:14px 0 0"><span class="n-ico">⚠️</span><div>' +
            esc(S.authError) + '</div></div>' : '') +
          '<div style="margin-top:18px;text-align:center">' +
            '<a class="desc" href="#/dash" style="text-decoration:underline">' + esc(t('admin.back')) + '</a>' +
          '</div>' +
        '</div></div>' +
      '</div></main>';
  }

  const data = S.adminData || {};
  const o = data.overview;
  const settings = (data.settings && data.settings.settings) || o && o.settings;
  const users = (data.users && data.users.users) || [];
  const total = (data.users && data.users.total) || 0;

  return '' +
    '<main>' +
      '<div class="page-h">' +
        '<h1>' + esc(t('admin.title')) + '</h1>' +
        // 「管理会话 · 12 小时」chip 与「返回我的通知」不再显示：
        //   会话时长是实现细节，返回是浏览器导航就有的动作。
        // 但「退出管理」保留（2026-10-09 用户要求恢复）—— 它是**服务端清会话**，
        //   浏览器导航做不到，公共机器上必须能主动登出。
        '<div class="spacer"></div>' +
        '<button class="btn" data-act="admin-logout">' + esc(t('admin.logout')) + '</button>' +
      '</div>' +

      (o && o.warnings && o.warnings.length
        ? o.warnings.map(function (w) {
            return '<div class="note bad" style="margin-bottom:10px"><span class="n-ico">⚠️</span><div>' + esc(w) + '</div></div>';
          }).join('')
        : '') +

      overviewCards(o) +
      instanceCard(o) +
      cronCard(o) +
      settingsCard(settings, data) +
      usersCard(users, total, o) +
    '</main>';
}

/** 四张概览卡。数据都来自 /api/admin/overview —— 全是计数，没有内容 */
function overviewCards(o) {
  if (!o) return '';
  const u = o.users || { total: 0, active: 0, remaining: 0 };
  const day = o.deliveriesLast24h || { sent: 0, failed: 0 };
  // 上限在 settings 里，不在 users 里 —— 别从 users 上取，会渲染成 "2 / undefined"
  const maxUsers = (o.settings && o.settings.maxUsers) || 0;

  function card(label, value, sub, bad) {
    // 复用概览页那套 .stat 的类名（.v / .k / .sub），视觉语言保持一致
    return '<div class="stat"><div class="v"' + (bad ? ' style="color:var(--danger)"' : '') + '>' +
      esc(String(value)) + '</div>' +
      '<div class="k">' + esc(label) + '</div>' +
      (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</div>';
  }

  // 概览卡不是 .card（它没有标题栏），而只有 .card 自带 margin-bottom ——
  // 不显式加这一行，这一排数字就会**贴着**下面那张「实例状态」卡片（截图核对过）。
  // 概览页那两处 grid 也都是这么写的，保持一致。
  return '<div class="grid g4" style="margin-bottom:16px">' +
    card(t('admin.statUsers'), u.active + ' / ' + maxUsers, t('admin.statUsersSub', { total: u.total, remaining: u.remaining })) +
    card(t('admin.statSent'), day.sent, t('admin.statSentSub')) +
    card(t('admin.statFailed'), day.failed, t('admin.statFailedSub'), day.failed > 0) +
    card(t('admin.statPending'), o.pendingDeliveries, t('admin.statPendingSub')) +
  '</div>';
}

function instanceCard(o) {
  if (!o) return '';
  const i = o.instance;
  function row(k, v) {
    return '<div class="kv"><span class="k">' + esc(k) + '</span><span class="v mono">' + esc(String(v)) + '</span></div>';
  }
  return '<div class="card"><div class="card-h"><span class="ico">🌐</span><h2>' + esc(t('admin.instance')) + '</h2></div>' +
    '<div class="card-b">' +
      row(t('admin.iMode'), i.multiUser ? t('admin.iModeMulti') : t('admin.iModeSolo')) +
      row(t('admin.iBaseUrl'), i.baseUrl) +
      // 运行环境 / 数据库：从用户概览搬过来的运维信息
      row(t('admin.iRuntime'), i.runtime || '—') +
      row(t('admin.iDb'), i.dbDriver) +
      row(t('admin.iBatch'), i.tickBatchSize) +
      row(t('admin.iCron'), i.internalCron ? t('admin.iCronInternal') : t('admin.iCronExternal')) +
      row(t('admin.iLastTick'), o.lastTick ? fmtDateTime(new Date(o.lastTick.at)) : t('c.never')) +
    '</div></div>';
}

/**
 * 「自动调度」卡片。
 *
 * 为什么要有它：调度没配好时，**用户那一侧只会看到一句"通知不会自动发出，请联系
 * 管理员"**（`/api/health` 是免登录的，不能把运维细节摊给所有用户）。
 * 于是"到底该怎么配"必须有个地方说清楚 —— 就是这里。
 *
 * 刻意**不显示 CRON_SECRET 的值**：它按设计要贴进第三方调度器后台，
 * 而这个页面走的是浏览器会话；要让管理员拿到值，用 `npm run dev-cron`
 * 在服务器上读环境变量（那是他自己设的，不算新增权限）。
 */
function cronCard(o) {
  if (!o || !o.instance) return '';
  const i = o.instance;
  const last = o.lastTick;
  const internal = !!i.internalCron;

  function row(k, v) {
    return '<div class="kv"><span class="k">' + esc(k) + '</span><span class="v mono">' + esc(String(v)) + '</span></div>';
  }

  /*
   * 口令那一行单独拼：默认只给掩码 + 「显示口令」。
   * 用固定长度的掩码（不是按真实长度生成）—— 长度本身也是信息。
   */
  let secretRow;
  if (S.adminCronSecret == null) {
    secretRow = '<div class="kv"><span class="k">CRON_SECRET</span><span class="v">' +
      '<code>••••••••••••</code> ' +
      '<button class="btn sm" data-act="admin-reveal-cron">' + esc(t('admin.cronReveal')) + '</button>' +
      '</span></div>';
  } else {
    secretRow = '<div class="kv"><span class="k">CRON_SECRET</span><span class="v">' +
      '<code style="word-break:break-all">' + esc(S.adminCronSecret || '—') + '</code> ' +
      '<button class="btn sm" data-act="copy" data-text="' + esc(S.adminCronSecret) + '">' + esc(t('c.copy')) + '</button> ' +
      '<button class="btn sm ghost" data-act="admin-hide-cron">' + esc(t('admin.cronHide')) + '</button>' +
      '</span></div>' +
      (S.adminCronInsecure
        ? '<div class="note bad" style="margin-top:10px"><span class="n-ico">⚠️</span><div>' +
          esc(t('admin.cronInsecure')) + '</div></div>'
        : '');
  }

  return '<div class="card"><div class="card-h"><span class="ico">⏱️</span><h2>' + esc(t('admin.cron')) + '</h2>' +
      '<div class="spacer"></div>' +
      '<span class="chip ' + (last ? 'ok' : 'warn') + '">' +
        esc(last ? t('admin.cronRunning') : t('admin.cronNever')) + '</span>' +
    '</div>' +
    '<div class="card-b">' +
      row(t('admin.cronEndpoint'), (internal ? '' : 'POST ') + (i.tickEndpoint || '')) +
      // 进程内定时器不需要外部凭据，就别显示这两行 —— 免得管理员以为还要配
      (internal ? '' : row(t('admin.cronAuth'), 'Authorization: Bearer <CRON_SECRET>')) +
      (internal ? '' : secretRow) +
      row(t('admin.cronLast'), last ? fmtDateTime(new Date(last.at)) + ' · ' + relTime(last.at) : t('c.never')) +
      '<div class="note" style="margin-top:12px"><span class="n-ico">ℹ️</span><div>' +
        esc(internal
          ? t('admin.cronInternalHint', { expr: i.internalCronExpression || '' })
          : t('admin.cronHint')) +
      '</div></div>' +
    '</div></div>';
}

function settingsCard(settings, data) {
  if (!settings) return '';
  const regConfigured = data.settings && data.settings.registrationSecretConfigured;
  // 环境变量里也有一把口令时要说出来 —— 否则管理员点完「清除」发现还要口令，
  // 会以为是清除没生效（其实是回落到了环境变量那把）
  const regFromEnv = data.settings && data.settings.registrationSecretFromEnv;
  // 账号数上限由服务端下发（core/limits.ts 的 MAX_USERS_LIMIT）；没加载出来时退回兜底值
  const maxUsersLimit = (data.settings && data.settings.maxUsersLimit) || LIMIT_FALLBACK.maxUsers;
  const draft = S.adminSettingsDraft || settings;

  return '<div class="card"><div class="card-h"><span class="ico">⚙️</span><h2>' + esc(t('admin.settings')) + '</h2>' +
      '<div class="spacer"></div>' +
    '<span class="chip">' + esc(regConfigured ? t('admin.regGated') : t('admin.regOpenChip')) + '</span>' +
  '</div>' +
  '<div class="card-b">' +
    // 勾选框和标题同一行；说明文字在下面单独一行（2026-10-10 用户要求）
    '<label class="field">' +
      '<span class="row" style="gap:8px">' +
        '<input type="checkbox" data-bind="adminRegOpen"' + (draft.registrationOpen ? ' checked' : '') + '>' +
        '<span class="lb" style="margin:0">' + esc(t('admin.regOpen')) + '</span>' +
      '</span>' +
      '<span class="desc">' + esc(t('admin.regOpenHint')) + '</span>' +
    '</label>' +
    '<label class="field"><span class="lb">' + esc(t('admin.maxUsers')) + '</span>' +
      '<input class="inp" type="number" min="1" max="' + maxUsersLimit + '" data-bind="adminMaxUsers" value="' + esc(draft.maxUsers) + '">' +
      '<span class="desc">' + esc(t('admin.maxUsersHint', { max: maxUsersLimit })) + '</span>' +
    '</label>' +
    /*
     * 注册口令。**永远回显不出原值** —— 服务端只存哈希、也只回"有没有设"，
     * 所以这里是一个"覆盖式"输入框：留空 = 不动它，填了就换新的。
     * 想撤销得用下面的「清除」，而不是"清空后保存"（那样会分不清
     * "我要清掉" 和 "我这次不想改"）。
     */
    '<label class="field"><span class="lb">' + esc(t('admin.regSecret')) + '</span>' +
      '<input class="inp" type="password" autocomplete="new-password" data-bind="adminRegSecret" ' +
        'value="' + esc(draft.registrationSecret || '') + '" ' +
        'placeholder="' + esc(regConfigured ? t('admin.regSecretSet') : t('admin.regSecretUnset')) + '">' +
      '<span class="desc">' + esc(t('admin.regSecretHint')) + '</span>' +
    '</label>' +
    '<div class="row" style="align-items:center;gap:10px;flex-wrap:wrap">' +
      '<button class="btn p" data-act="admin-save-settings">' +
        esc(S.adminBusy.saveSettings ? t('c.loading') : t('c.save')) + '</button>' +
      (regConfigured
        ? '<button class="btn d" data-act="admin-clear-regsecret">' + esc(t('admin.regSecretClear')) + '</button>'
        : '') +
    '</div>' +
    (regFromEnv
      ? '<div class="note" style="margin-top:12px"><span class="n-ico">ℹ️</span><div>' +
        esc(t('admin.regSecretEnvNote')) + '</div></div>'
      : '') +
  '</div></div>';
}

function usersCard(users, total, o) {
  const h = '<div class="card"><div class="card-h"><span class="ico">👥</span><h2>' + esc(t('admin.users')) + '</h2>' +
    '<div class="spacer"></div><span class="chip">' + esc(t('admin.usersCount', { n: total })) + '</span></div>' +
    '<div class="card-b">';

  if (!users.length) {
    return h + '<div class="empty">' + esc(t('admin.noUsers')) + '</div></div></div>';
  }

  return h +
    '<div class="tbl-wrap"><table class="tbl">' +
      '<thead><tr>' +
        '<th>' + esc(t('admin.colUser')) + '</th>' +
        '<th>' + esc(t('admin.colStatus')) + '</th>' +
        '<th>' + esc(t('admin.colRules')) + '</th>' +
        '<th>' + esc(t('admin.colChannels')) + '</th>' +
        '<th>' + esc(t('admin.colDeliveries')) + '</th>' +
        '<th>' + esc(t('admin.colLastLogin')) + '</th>' +
        '<th>' + esc(t('admin.colActions')) + '</th>' +
      '</tr></thead><tbody>' +
      users.map(function (u) { return userRow(u); }).join('') +
    '</tbody></table></div>' +
    '</div></div>';
}

function userRow(u) {
  const suspended = u.status !== 'active';
  const badge = suspended
    ? '<span class="chip warn">' + esc(t('admin.statusSuspended')) + '</span>'
    : '<span class="chip ok">' + esc(t('admin.statusActive')) + '</span>';

  // 账号列**只留账号名**（2026-10-09 用户要求）：不再展示下方 UUID，
  // 也不再挂「未连接 Trakt / 凭据失效」chip。操作按钮仍用 data-id 里的 UUID。
  return '<tr>' +
    '<td><b>' + esc(u.traktUsername || u.traktSlug || t('admin.credNone')) + '</b></td>' +
    '<td>' + badge + '</td>' +
    '<td>' + esc(String(u.rules)) + '</td>' +
    '<td>' + esc(String(u.channels)) + '</td>' +
    '<td>' + esc(String(u.deliveries)) + (u.failed ? ' <span class="chip bad">' + esc(t('admin.failedN', { n: u.failed })) + '</span>' : '') + '</td>' +
    // ⚠️ 这里**不能**用 `class="desc"`：`.desc` 是给输入框下方说明文字设计的，
    //   带 `margin-top:5px` —— 用在单元格上会把整格往下推 5px，
    //   表现为「最后登录」比别的列低半格。
    '<td>' + esc(u.lastLoginAt ? fmtDateTime(new Date(u.lastLoginAt)) : t('c.never')) + '</td>' +
    /*
     * ⚠️ flex 要放在**内层 div** 上，不能直接写成 `<td class="row">`。
     *    给 td 设 display:flex 会让它脱离表格布局（不再是 table-cell），
     *    于是浏览器把它塞进一个匿名单元格里单独算宽 —— 表现就是这一格的
     *    按钮跑到**上一列（最后登录）下面**去，而不是对齐到「操作」列。
     *    （下面这行注释里的反例本身也被 test:ui 的断言扫到过，所以那条断言
     *      先去掉注释再扫 —— 见 tests/ui.smoke.mjs 的 codeNoComments。）
     */
    '<td><div class="row">' +
      '<button class="btn" data-act="admin-toggle-user" data-id="' + esc(u.id) + '" data-status="' + (suspended ? 'active' : 'suspended') + '">' +
        esc(suspended ? t('admin.restore') : t('admin.suspend')) + '</button>' +
      '<button class="btn d" data-act="admin-delete-user" data-id="' + esc(u.id) + '" data-short="' + esc(u.id.slice(0, 8)) + '">' +
        esc(t('admin.remove')) + '</button>' +
    '</div></td>' +
  '</tr>';
}

async function loadAdmin() {
  try {
    S.admin = await api('/admin/session');
    if (S.admin && S.admin.authenticated) {
      const res = await Promise.all([
        api('/admin/overview').catch(function () { return null; }),
        api('/admin/settings').catch(function () { return null; }),
        api('/admin/users?limit=100').catch(function () { return null; }),
      ]);
      S.adminData = { overview: res[0], settings: res[1], users: res[2] };
      // 每次重新加载管理页都把口令收回去 —— 不然它会一直挂在屏幕上
      S.adminCronSecret = null;
      S.adminCronInsecure = false;
      const s = res[1] && res[1].settings;
      // registrationSecret 永远是空串：服务端不回传口令（只存哈希、只报有没有设），
      // 所以这个输入框是"覆盖式"的 —— 留空即不修改。
      if (s) S.adminSettingsDraft = { registrationOpen: s.registrationOpen, maxUsers: s.maxUsers, registrationSecret: '' };
    }
  } catch (e) {
    S.admin = { authenticated: false };
    S.authError = e.message;
  }
}

/* =====================================================================
   渲染与数据加载
   ===================================================================== */

function render() {
  const app = document.getElementById('app');
  // 管理控制台**先于**登录态判断：它不依赖用户会话，未登录的人也能打开
  // （会看到登录框）。放在后面的话，管理员在没登录 Trakt 的浏览器里
  // 永远打不开这个页面。
  if (S.route === 'admin') {
    app.innerHTML = viewAdmin();
    return;
  }
  if (!S.session) {
    app.innerHTML = '<main><div class="empty" style="padding-top:120px"><span class="spin"></span> ' + esc(t('c.loading')) + '…</div></main>';
    return;
  }
  if (!S.session.authenticated) {
    app.innerHTML = viewAuth();
    return;
  }
  app.innerHTML = shell();
  if (S.route === 'rules' && S.editing) refreshEditor();
}

async function loadSession() {
  S.session = await api('/auth/session');
  return S.session;
}

async function loadAll() {
  const res = await Promise.all([
    api('/meta').catch(function () { return null; }),
    api('/health').catch(function () { return null; }),
    api('/rules/vocabulary').catch(function () { return null; }),
    api('/channels/meta').catch(function () { return null; }),
    api('/rules').catch(function () { return { rules: [] }; }),
    api('/channels').catch(function () { return { channels: [] }; }),
    api('/logs/health').catch(function () { return null; }),
  ]);
  S.meta = res[0];
  S.health = res[1];
  S.ruleVocab = res[2];
  S.channelMeta = (res[3] && res[3].channels) || [];
  S.failStreakLimit = (res[3] && res[3].failStreakLimit) || 5;
  S.rules = (res[4] && res[4].rules) || [];
  S.channels = (res[5] && res[5].channels) || [];
  S.logHealth = res[6];
}

async function loadPreview() {
  S.busy.preview = true;
  render();
  try {
    S.preview = await api('/preview', {
      method: 'POST',
      body: { horizonDays: S.previewDays, lookbackDays: S.previewLookback },
    });
    // ⚠️ 失败时**不要**清标记：留着才能下次进页面时重试（失败还清 = 永远停在过期数据）
    S.previewStale = false;
    // 记下"算过的窗口" = 我们发出去的那两个数（不是服务端回显的，见 previewApplied 的注释）
    S.previewApplied = { days: S.previewDays, lookback: S.previewLookback };
  } catch (e) {
    toast(e.message, 'bad');
  } finally {
    S.busy.preview = false;
  }
}

/**
 * 规则（或渠道）变了 ⇒ 推送预览里的"会推什么"随之变，标脏并按需立刻重算。
 *
 * 为什么需要它：预览是**独立算出来**的一份快照（`/api/preview` 走一次 dryRun），
 * 不会自己跟着规则变。所以**每个改动入口都必须标脏**：
 *   · 卡片头那个启用开关（`rule-enable`）也要重算；
 *   · `gotoRoute` 只在 `!S.preview` 时拉一次 ⇒ 光靠它，之后再改规则也不刷新。
 *
 * 只在**正盯着这一屏**时才发请求（概览页也用 S.preview 显示"即将推送"）；
 * 在规则页改完就切走的话，切过去时由 `gotoRoute` 补 —— 改一个开关就打一次
 * dryRun 没必要。
 */
/**
 * 「窗口改了但还没重算」的判断：**输入框里的值** vs **上次真正算过的值**。
 * 见 `S.previewApplied` 的注释（为什么比"我们发出去的"而不是"服务端回显的"）。
 */
function previewWindowDirty() {
  const a = S.previewApplied;
  if (!a) return false;
  return a.days !== S.previewDays || a.lookback !== S.previewLookback;
}

/**
 * 只改提示条的显隐，**不重绘整页**。
 *
 * ⚠️ 千万别在这里调 render()：输入框正被编辑，重绘会让它失焦，
 * 用户就再也敲不进第二位数字（这个坑很隐蔽 —— 表现为"只能改一位数"）。
 */
function markPreviewWindowDirty() {
  const dirty = previewWindowDirty();
  // 「重新计算」显隐 + 提为主按钮（主按钮态同时点亮了那个小圆点，见 .btn .dot）
  const btn = document.getElementById('pvRecalc');
  if (btn) {
    btn.hidden = !dirty;
    btn.classList.toggle('p', dirty);
  }
}

function markPreviewStale() {
  S.previewStale = true;
  if (S.route === 'dash' || S.route === 'preview') {
    loadPreview().then(render).catch(function () { /* loadPreview 自己 toast 过 */ });
  }
}

async function loadLogs() {
  try {
    S.logs = await api('/logs?status=' + encodeURIComponent(S.logStatus) + '&limit=100');
  } catch (e) {
    toast(e.message, 'bad');
  }
  S.logHealth = await api('/logs/health').catch(function () { return S.logHealth; });
}

async function gotoRoute(route) {
  S.route = route;
  if (location.hash !== '#/' + route) location.hash = '#/' + route;

  // 管理控制台走自己的一套数据加载，且不碰用户会话相关的接口
  if (route === 'admin') {
    if (!S.admin) await loadAdmin();
    render();
    return;
  }

  // 🔴 没登录就别去拉预览/日志 —— `/preview` 会返回 409（"还没有连接任何 Trakt 账号"），
  //   把那句弹给一个只是**从管理页点了返回**的人既唐突又让人以为自己账号坏了。
  //   登录页本身就把该做的说清楚了，这里安静地停住即可。
  //
  // ⚠️ `S.session` 可能是 **null**（从管理页直接过来时它从没被拉过）——
  //   那样 `render()` 会走进"加载中…"分支永远停住，所以这里必须先补一次会话。
  if (!S.session) {
    try { await loadSession(); } catch (e) { S.session = { authenticated: false, error: e.message }; }
  }
  if (!(S.session && S.session.authenticated)) {
    render();
    return;
  }

  render();

  try {
    if (route === 'dash' || route === 'preview') {
      // 🔴 带标就重算：不带的话"改完规则切过来还是旧计划"，而界面上完全看不出它旧了
      if (!S.preview || S.previewStale) await loadPreview();
      render();
    } else if (route === 'logs') {
      await loadLogs();
      render();
    }
  } catch (e) {
    toast(e.message, 'bad');
  }
}

/* =====================================================================
   设备码授权流程
   ===================================================================== */

async function startDeviceFlow() {
  if (S.deviceTimer) { clearTimeout(S.deviceTimer); S.deviceTimer = null; }
  S.authError = null;
  S.authErrorCode = null;

  // 服务端也会拒（401），但先在本地拦一道，省一次往返，也把话说得更清楚。
  // 该拦哪一项由模式决定：单用户要管理页口令，多用户（配了的话）要注册口令。
  const s = S.session || {};
  if (s.adminCredentialRequired === true && !S.adminSecret.trim()) {
    S.authError = t('auth.adminSecretRequired');
    S.authErrorCode = 'ADMIN_SECRET_EMPTY';
    render();
    return;
  }
  if (s.registrationSecretRequired === true && !S.registrationSecret.trim()) {
    S.authError = t('auth.regSecretRequired');
    S.authErrorCode = 'REGISTRATION_SECRET_EMPTY';
    render();
    return;
  }

  S.busy.deviceStart = true;
  render();
  try {
    const d = await api('/auth/device/start', { method: 'POST' });
    S.device = {
      deviceCodeId: d.deviceCodeId,
      user_code: d.user_code,
      activation_url: d.activation_url,
      verification_url: d.verification_url,
      expiresAt: Date.now() + d.expires_in * 1000,
      pollAfter: d.poll_after_ms || 5000,
      status: 'pending',
    };
  } catch (e) {
    S.authError = e.message;
    S.authErrorCode = (e.data && e.data.error) || null;
    S.device = null;
  } finally {
    S.busy.deviceStart = false;
    render();
    if (S.device) schedulePoll();
  }
}

function schedulePoll() {
  if (S.deviceTimer) clearTimeout(S.deviceTimer);
  S.deviceTimer = setTimeout(pollDevice, S.device ? S.device.pollAfter : 5000);
}

async function pollDevice() {
  if (!S.device) return;
  if (Date.now() > S.device.expiresAt) {
    S.device.status = 'expired';
    render();
    return;
  }
  try {
    const r = await api('/auth/device/poll', { method: 'POST', body: { deviceCodeId: S.device.deviceCodeId } });
    if (r.status === 'ok') {
      S.device = null;
      if (S.deviceTimer) { clearTimeout(S.deviceTimer); S.deviceTimer = null; }
      await loadSession();
      await loadAll();
      await loadPreview().catch(function () {});
      toast(t('acct.connectedAs') + ' ' + ((r.user && r.user.username) || ''), 'ok');
      render();
      return;
    }
    S.device.status = r.status;
    if (r.status === 'slow_down') S.device.pollAfter = Math.min(S.device.pollAfter * 2, 60000);
  } catch (e) {
    // 409 REBIND_BLOCKED：授权成功，但换的是另一个 Trakt 账号，
    // 而改绑实例所有权需要管理页口令。单独成一态，好在界面上给出下一步。
    if (e.data && e.data.error === 'REBIND_BLOCKED') {
      S.device.status = 'rebind_blocked';
      S.device.message = e.data.message;
      S.device.rebind = e.data;
    } else {
      S.device.status = 'error';
      S.device.message = e.message;
    }
  }
  render();
  if (S.device && (S.device.status === 'pending' || S.device.status === 'slow_down')) schedulePoll();
}

/* =====================================================================
   事件处理（全局委托，避免每次重绘都重新绑定）
   ===================================================================== */

document.addEventListener('click', async function (e) {
  /*
   * 🔴 开关必须**在取 `[data-act]` 之前**处理掉。
   *
   * 规则卡的开关嵌在 `.rule-h[data-act=rule-toggle]` 里面，于是点击那个像素时
   * `e.target.closest('[data-act]')` 先命中**外层**的 `rule-toggle`，
   * 不先 return 的话后面 `switch(act)` 会把「展开/收起」也执行一遍
   * ⇒ 两个分支各自 `await` + `render()`，后到的那个把前一个的结果覆盖掉，
   * 表现就是「开关闪一下又弹回去」。
   *
   * 渠道卡没有外层 data-act，所以它一直"看起来是好的" ——
   * 实际上它坏在另一处（handler 里多翻了一次 `box.checked`）。
   * 两处一起才有用户看到的现象，**只修一处都不够**。
   */
  const sw0 = e.target.closest('.switch');
  if (sw0) {
    // 从开关**自己内部**找动作，不靠 e.target 的位置 ——
    // 否则命中 label 还是 input 会拿到不同的答案。
    const owner = sw0.querySelector('[data-act]');
    const box = sw0.querySelector('input[type=checkbox]');
    if (owner && box) {
      e.preventDefault();
      e.stopPropagation();
      // 🔴 状态只有一个来源：**我们自己算出的新值**。
      //   不能读 `box.checked`—— 点击命中的是 `.sl`（input 是 0×0，点不到），
      //   浏览器那次「默认翻转」根本没发生，读到的永远是旧值。
      //   也不能指望 `<label>` 转发：实测它在这个结构下不可靠
      //   （`pointer-events` 一改就变），别把正确性押在浏览器细节上。
      const on = !box.checked;
      box.checked = on;
      const a = owner.dataset.act;
      if (a === 'rule-enable') {
        // 正在编辑这条时，草稿的 enabled 要跟着改 —— 开关是**立刻落库**的，
        // 而保存草稿会带上 enabled，不同步的话保存会把刚才点的那一下覆盖回去。
        if (S.editing && S.editing.id === owner.dataset.id) S.editing.enabled = on;
        await api('/rules/' + owner.dataset.id, { method: 'PATCH', body: { enabled: on } });
        // 🔴 启停会改变"会推什么" ⇒ 预览必须跟着重算
        //    （不重算的话，用户切到推送预览看到的是启停前的计划）
        markPreviewStale();
        await loadAll();
        render();
        return;
      }
      if (a === 'ch-toggle') {
        await api('/channels/' + owner.dataset.id, { method: 'PATCH', body: { enabled: on } });
        // 渠道启停会改预览里每条计划的「N 个渠道」
        markPreviewStale();
        await loadAll();
        render();
        return;
      }
    }
  }

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  try {
    switch (act) {
      case 'route':
        e.preventDefault();
        await gotoRoute(el.dataset.route);
        return;

      case 'theme':
        // 纯本地：改档位 → 换 data-theme → 重画按钮。不发请求、不落库。
        setTheme(nextTheme(S.theme));
        return;

      case 'copy': {
        const text = el.dataset.text || '';
        try { await navigator.clipboard.writeText(text); toast(t('c.copied'), 'ok'); }
        catch (err) { window.prompt(t('c.copy'), text); }
        return;
      }

      case 'device-start':
        await startDeviceFlow();
        return;

      /* ---------------- 管理控制台 ---------------- */

      case 'admin-login': {
        // 用口令换一个 12 小时的 tn_admin cookie，**口令本身不留在状态里**。
        // 留在内存里意味着"刷新后还要重输"，但也意味着它不会跟着每个请求跑。
        S.adminBusy.login = true;
        S.authError = null;
        render();
        try {
          await api('/admin/login', { method: 'POST', body: { secret: S.adminSecretInput } });
          S.adminSecretInput = '';
          S.admin = null;
          await loadAdmin();
        } catch (err) {
          S.authError = err.message;
        } finally {
          S.adminBusy.login = false;
          render();
        }
        return;
      }

      case 'admin-logout': {
        // 调服务端清掉 tn_admin cookie，再回到未登录态。
        // 清完把管理数据一并丢掉 —— 否则"退出"之后屏幕上还留着上一个会话
        // 读到的用户列表，看着像没退出成功。
        try {
          await api('/admin/logout', { method: 'POST' });
        } catch (err) {
          // 服务端清失败也要把本地状态收回去：口令已经不在内存里了，
          // 继续显示过期数据比"看起来没登出"更糟。
          toastErr(err);
        }
        S.admin = null;
        S.adminData = null;
        S.adminCronSecret = null;
        S.adminSecretInput = '';
        render();
        return;
      }

      case 'admin-save-settings': {
        S.adminBusy.saveSettings = true;
        render();
        try {
          const d = S.adminSettingsDraft || {};
          const body = { registrationOpen: d.registrationOpen, maxUsers: d.maxUsers };
          // 留空 = 不改动注册口令。**不能**把空串当成"清除"发过去 ——
          // 那会让每次保存设置都顺手把口令抹掉。清除有专门的按钮。
          if (d.registrationSecret) body.registrationSecret = d.registrationSecret;
          await api('/admin/settings', { method: 'PATCH', body: body });
          toast(t('c.saved'), 'ok');
          await loadAdmin();
        } catch (err) {
          toastErr(err);
        } finally {
          S.adminBusy.saveSettings = false;
          render();
        }
        return;
      }

      /*
       * 取调度凭据的明文。
       *
       * 刻意做成"点了才取"，而不是随 overview 一起发下来：管理页一打开就把口令
       * 摊在屏幕上，等于它一定出现在截屏、录屏和别人从背后看一眼的视野里。
       */
      case 'admin-reveal-cron': {
        try {
          const r = await api('/admin/cron-secret');
          S.adminCronSecret = r.cronSecret || '';
          S.adminCronInsecure = !!r.insecureTransport;
        } catch (err) {
          toastErr(err);
        }
        render();
        return;
      }

      case 'admin-hide-cron': {
        S.adminCronSecret = null;
        render();
        return;
      }

      case 'admin-clear-regsecret': {        if (!window.confirm(t('admin.regSecretClearConfirm'))) return;
        try {
          // 显式发空串 = 清除（服务端把空串当清除，不是"设成空口令"）
          await api('/admin/settings', { method: 'PATCH', body: { registrationSecret: '' } });
          toast(t('admin.regSecretCleared'), 'ok');
          await loadAdmin();
        } catch (err) {
          toastErr(err);
        }
        render();
        return;
      }

      case 'admin-toggle-user': {
        const id = el.dataset.id;
        const status = el.dataset.status;
        try {
          await api('/admin/users/' + encodeURIComponent(id), { method: 'PATCH', body: { status: status } });
          toast(status === 'suspended' ? t('admin.suspended') : t('admin.restored'), 'ok');
          await loadAdmin();
        } catch (err) {
          toastErr(err);
        }
        render();
        return;
      }

      case 'admin-delete-user': {
        const id = el.dataset.id;
        const shortId = el.dataset.short || '';
        // 服务端也要求 confirm，但这里先问一次：这是个不可逆的操作，
        // 让用户在删之前看见自己删的是哪一个（现在只能靠用户 ID 认人）
        const typed = window.prompt(t('admin.deleteConfirm', { id: shortId }), '');
        if (typed === null) return;
        try {
          await api('/admin/users/' + encodeURIComponent(id) + '?confirm=' + encodeURIComponent(typed), { method: 'DELETE' });
          toast(t('admin.deleted'), 'ok');
          await loadAdmin();
        } catch (err) {
          toastErr(err);
        }
        render();
        return;
      }

      // 退回"填管理页口令"那一步，让用户能补上口令后重试改绑
      case 'device-reset':
        if (S.deviceTimer) { clearTimeout(S.deviceTimer); S.deviceTimer = null; }
        S.device = null;
        S.authError = t('auth.rebindHint');
        S.authErrorCode = null;
        render();
        return;

      case 'run-now': {
        S.busy.runNow = true;
        render();
        try {
          const r = await api('/preview/send-now', { method: 'POST' });
          S.lastRun = {
            ok: r.ok && !r.skippedBecause,
            text: r.skippedBecause
              ? t('dash.runSkipped', { why: r.skippedBecause })
              : t('dash.runDone', { planned: r.planned, sent: r.sent, failed: r.failed }),
          };
          if (r.errors && r.errors.length) S.lastRun.ok = false;
          await Promise.all([loadAll(), loadPreview(), loadLogs()]);
        } catch (err) {
          S.lastRun = { ok: false, text: err.message };
        } finally {
          S.busy.runNow = false;
          render();
        }
        return;
      }

      /* ---- 规则 ---- */
      case 'rule-new':
        S.editing = newDraft();
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;

      case 'rule-edit': {
        const r = S.rules.find(function (x) { return x.id === el.dataset.id; });
        if (r) {
          S.editing = draftFromRule(r);
          // 就地展开这条。ruleCardHtml 在编辑态本来就会强制展开，这里同步 openRules
          // 是为了取消编辑后卡片保持展开（否则表单一消失、卡片又合上，像被吞了一次点击）
          S.openRules[r.id] = true;
          render();
          // 🔴 不再滚到页面顶部 —— 表单就在刚点开的这条里面，滚走反而看不见它了
          const node = document.getElementById('rule-' + r.id);
          if (node) node.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        return;
      }

      case 'rule-cancel':
        S.editing = null;
        render();
        return;

      case 'rule-toggle': {
        // 🔴 编辑中的那条**不能收起**：表单就渲染在 .rule-b 里，
        //   收起等于把正在填的东西藏起来（用户会以为编辑器坏了）。
        if (S.editing && S.editing.id === el.dataset.id) return;
        S.openRules[el.dataset.id] = !S.openRules[el.dataset.id];
        render();
        return;
      }

      case 'content-toggle':
        toggleContent(el.dataset.group, el.dataset.key);
        refreshEditor();
        return;

      case 'seg': {
        const wrap = el.parentElement;
        const val = el.dataset.val;
        if (wrap.id === 'edDir') S.editing._dir = val;
        else if (wrap.id === 'edMode') S.editing.mode = val;
        if (wrap.id === 'edDir') syncOffsetFromUi();
        refreshEditor();
        return;
      }

      case 'offset-quick': {
        const m = Number(el.dataset.min);
        const sp = splitOffset(m);
        S.editing._dir = sp.dir; S.editing._num = sp.num; S.editing._unit = sp.unit;
        syncOffsetFromUi();
        const numEl = document.querySelector('#editor [data-bind="offsetNum"]');
        const unitEl = document.querySelector('#editor [data-bind="offsetUnit"]');
        if (numEl) numEl.value = String(sp.num);
        if (unitEl) unitEl.value = sp.unit;
        refreshEditor();
        return;
      }

      case 'rule-save': {
        const d = S.editing;
        if (!d.name.trim()) { toast(t('rules.nameRequired'), 'bad'); return; }
        const moviesEmpty = !d.content.movies.all && !d.content.movies.theatrical && !d.content.movies.homeRelease;
        if (isEmptyEpisodeSel(d.content.episodes) && moviesEmpty) { toast(t('rules.emptySelection'), 'bad'); return; }

        const payload = {
          name: d.name.trim(),
          enabled: d.enabled,
          content: d.content,
          offsetMinutes: d.offsetMinutes,
          mode: d.mode,
          digestTime: d.mode === 'digest' ? d.digestTime : null,
          // 开关 + 两个时间选择器 → 拼成库里的 'HH:mm-HH:mm'（关掉就发 null）
          quietHours: joinQuietHours(d.quietEnabled, d.quietStart, d.quietEnd),
          skipWatched: d.skipWatched,
        };
        S.busy.save = true;
        render();
        try {
          if (d.id) await api('/rules/' + d.id, { method: 'PATCH', body: payload });
          else await api('/rules', { method: 'POST', body: payload });
          S.editing = null;
          toast(t('rules.savedToast'), 'ok');
          markPreviewStale();
          await loadAll();
        } catch (err) {
          toastErr(err);
        } finally {
          S.busy.save = false;
          render();
        }
        return;
      }

      case 'rule-delete': {
        const r = S.rules.find(function (x) { return x.id === el.dataset.id; });
        if (!window.confirm(t('rules.deleteConfirm', { name: r ? r.name : '' }))) return;
        await api('/rules/' + el.dataset.id, { method: 'DELETE' });
        S.editing = null;
        toast(t('rules.deletedToast'), 'ok');
        markPreviewStale();
        await loadAll();
        render();
        return;
      }

      case 'rule-presets': {
        const r = await api('/rules/presets', { method: 'POST' });
        toast(t('rules.presetsDone', { n: r.count }), 'ok');
        markPreviewStale();
        await loadAll();
        render();
        return;
      }

      /* ---- 渠道 ---- */
      case 'ch-new':
        S.editingChannel = { id: null, type: (S.channelMeta[0] || {}).type || 'bark', name: '', config: {} };
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;

      case 'ch-edit': {
        const c = S.channels.find(function (x) { return x.id === el.dataset.id; });
        if (c) {
          S.editingChannel = { id: c.id, type: c.type, name: c.name || '', config: Object.assign({}, c.config) };
          render();
          // 🔴 不再滚到页面顶部 —— 表单就在这张卡里展开，滚走反而看不见它了
          const node = document.getElementById('ch-' + c.id);
          if (node) node.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        return;
      }

      case 'ch-cancel':
        S.editingChannel = null;
        render();
        return;

      case 'ch-save': {
        const d = S.editingChannel;
        const body = { type: d.type, name: d.name, config: d.config };
        S.busy.chSave = true;
        render();
        try {
          if (d.id) await api('/channels/' + d.id, { method: 'PATCH', body: { name: d.name, config: d.config } });
          else await api('/channels', { method: 'POST', body: body });
          S.editingChannel = null;
          toast(t('rules.savedToast'), 'ok');
          markPreviewStale();
          await loadAll();
        } catch (err) {
          toastErr(err);
        } finally {
          S.busy.chSave = false;
          render();
        }
        return;
      }

      case 'ch-test':
      case 'ch-test-form': {
        const isForm = act === 'ch-test-form';
        const key = isForm ? 'chTestForm' : 'test-' + el.dataset.id;
        S.busy[key] = true;
        render();
        try {
          const body = isForm
            ? (S.editingChannel.id
                ? { id: S.editingChannel.id, config: S.editingChannel.config }
                : { type: S.editingChannel.type, config: S.editingChannel.config })
            : { id: el.dataset.id };
          const r = await api('/channels/test', { method: 'POST', body: body });
          if (!r.ok) {
            toast(r.detail || t('ch.testFail', { msg: 'HTTP ' + r.httpStatus }), 'bad');
            return;
          }
          // ⚠️ 必须说清这次测的是**真实内容**还是占位文案：
          //   两者用的是同一段代码路径（同一套图片/链接加工），
          //   但占位那次**验证不了**基于影片数据的配置（海报、跳转链接都无从谈起）。
          //   不说清的话，用户会以为"配置生效了"，其实压根没走到那一步。
          toast(r.sample === 'real' ? t('ch.testOk') : t('ch.testOkPlain'), r.sample === 'real' ? 'ok' : 'bad');
        } catch (err) {
          toast(t('ch.testFail', { msg: err.message }), 'bad');
        } finally {
          S.busy[key] = false;
          render();
        }
        return;
      }

      case 'ch-delete':
        if (!window.confirm(t('ch.deleteConfirm', { name: el.dataset.name }))) return;
        await api('/channels/' + el.dataset.id, { method: 'DELETE' });
        markPreviewStale();
        await loadAll();
        render();
        return;

      /* ---- 预览 ---- */
      case 'preview-run':
        await loadPreview();
        render();
        return;

      /* ---- 日志 ---- */
      case 'log-filter':
        S.logStatus = el.dataset.val;
        await loadLogs();
        render();
        return;

      case 'logs-load':
        await loadLogs();
        render();
        return;

      case 'log-retry':
        await api('/logs/' + el.dataset.id + '/retry', { method: 'POST' });
        toast(t('log.retryQueued'), 'ok');
        await loadLogs();
        render();
        return;

      case 'logs-prune': {
        const r = await api('/logs/prune', { method: 'POST' });
        toast(t('log.pruned', { locks: r.prunedLocks, cache: r.prunedCache }), 'ok');
        await loadLogs();
        render();
        return;
      }

      /* ---- 设置 ---- */
      case 'settings-save': {
        const tzVal = (document.getElementById('setTz') || {}).value || '';
        const locVal = (document.getElementById('setLocale') || {}).value || S.locale;
        if (!isValidTzClient(tzVal)) { toast(t('set.badTimezone'), 'bad'); return; }
        S.busy.settings = true;
        render();
        try {
          await api('/auth/settings', { method: 'PATCH', body: { timezone: tzVal, locale: locVal } });
          S.locale = locVal;
          localStorage.setItem('tn.locale', locVal);
          document.documentElement.lang = locVal;
          await loadSession();
          toast(t('set.saved'), 'ok');
        } catch (err) {
          toastErr(err);
        } finally {
          S.busy.settings = false;
          render();
        }
        return;
      }

      case 'disconnect':
        if (!window.confirm(t('acct.disconnectWarn'))) return;
        await api('/auth/disconnect', { method: 'POST' });
        S.session = null;
        S.rules = []; S.channels = []; S.preview = null; S.logs = null;
        await loadSession();
        render();
        return;

      // 删除自己的账号 —— 不可逆。
      //
      // 只保留一道**原生确认框**（说清"删掉的是什么、影响几个渠道"）：
      // 这个操作不可逆，确认框能防误触就够了；再让用户手打一遍用户名是多余的摩擦
      // （2026-10-10 用户要求去掉）。删除目标恒为会话本人，没有"删错别人"的可能。
      case 'delete-account': {
        const name = myUsername();
        if (!name) return;

        // 把"会失去什么"写进确认框：光说"确定删除？"等于没提醒
        const warn = t('set.deleteWarn', {
          name: name,
          rules: S.rules.length,
          channels: S.channels.length,
        });
        if (!window.confirm(warn)) return;

        S.busy.deleteAccount = true;
        render();
        try {
          await api('/auth/account', { method: 'DELETE' });
          // 服务端已经清掉了 cookie；重新问一次会话，拿到当前部署模式，
          // 这样回到的是正确的登录页（多用户 / 单用户文案不同）
          S.session = null;
          S.device = null;
          S.rules = []; S.channels = []; S.preview = null; S.logs = null;
          await loadSession();
          toast(t('set.deleted'), 'ok');
        } catch (err) {
          toastErr(err);
        } finally {
          S.busy.deleteAccount = false;
          render();
        }
        return;
      }
    }
  } catch (err) {
    toastErr(err);
  }
});

/* 输入类：改草稿后只刷新派生显示，不重绘表单 */
function onFieldInput(e) {
  const el = e.target;
  if (!el || !el.dataset) return;

  // 渠道表单
  if (el.dataset.cfg) {
    if (!S.editingChannel) return;
    S.editingChannel.config[el.dataset.cfg] = el.type === 'checkbox' ? String(el.checked) : el.value;
    // 🔴 改了下拉就要**重绘整个表单**，否则带 showIf 的字段不会出现 / 不消失
    //（例如 imageMode 切到「固定图片」才该露出地址输入框）。
    // 值已经写进 draft.config，所以重绘不会丢用户刚填的东西 ——
    // 这也是 showIf 只控制"显不显示"、不碰存储的原因。
    if (el.tagName === 'SELECT') render();
    return;
  }
  const bind = el.dataset.bind;
  if (!bind) return;

  if (bind === 'locale') { setLocale(el.value); return; }
  if (bind === 'adminSecret') { S.adminSecret = el.value; return; }
  if (bind === 'registrationSecret') { S.registrationSecret = el.value; return; }
  if (bind === 'adminSecretInput') { S.adminSecretInput = el.value; return; }
  if (bind === 'adminRegOpen' || bind === 'adminMaxUsers' || bind === 'adminRegSecret') {
    if (!S.adminSettingsDraft) S.adminSettingsDraft = { registrationOpen: true, maxUsers: 50, registrationSecret: '' };
    if (bind === 'adminRegOpen') S.adminSettingsDraft.registrationOpen = el.checked;
    else if (bind === 'adminMaxUsers') S.adminSettingsDraft.maxUsers = Number(el.value) || 1;
    else S.adminSettingsDraft.registrationSecret = el.value;
    return;
  }
  if (bind === 'previewDays' || bind === 'previewLookback') {
    // ⚠️ `0` 是合法值（过去 0 天 = 只看已到期），所以**不能**用 `|| 默认值` ——
    //   那会把用户明确填的 0 变成默认值。空输入框则退回默认。
    const isDays = bind === 'previewDays';
    const fallback = limit(isDays ? 'defaultHorizonDays' : 'defaultLookbackDays');
    const n = Number(el.value);
    const v = el.value === '' || !Number.isFinite(n) || n < 0 ? fallback : Math.floor(n);
    if (isDays) S.previewDays = v;
    else S.previewLookback = v;
    // 记在本地，下次打开沿用
    rememberDays(isDays ? 'tn.previewDays' : 'tn.previewLookback', v);
    // 🔴 **不立即重算**（2026-10-05 用户要求）：每敲一个数字就干跑一次预览，
    //   既吵（整屏转圈）又慢，而用户往往还要接着改另一个框。
    //   改成只提示"点重新计算生效"，由他决定什么时候算。
    //   ⚠️ 这里也**不能 render()**：那会重绘整页、输入框失焦，第二位数字就敲不进去了。
    //     所以提示条用 DOM 直接改；真正重绘时 viewPreview 会按状态重算它。
    markPreviewWindowDirty();
    return;
  }
  if (bind === 'chType') {
    S.editingChannel.type = el.value;
    S.editingChannel.config = {};
    render();
    return;
  }
  if (bind === 'chName') { S.editingChannel.name = el.value; return; }

  // 规则草稿
  const d = S.editing;
  if (!d) return;
  switch (bind) {
    case 'name': d.name = el.value; break;
    case 'enabled': d.enabled = el.checked; break;
    case 'digestTime': d.digestTime = el.value; break;
    case 'quietEnabled': d.quietEnabled = el.checked; refreshEditor(); break;
    case 'quietStart': d.quietStart = el.value; break;
    case 'quietEnd': d.quietEnd = el.value; break;
    case 'skipWatched': d.skipWatched = el.checked; break;
    case 'offsetNum': d._num = Math.abs(Number(el.value) || 0); syncOffsetFromUi(); refreshEditor(); break;
    case 'offsetUnit': d._unit = el.value; syncOffsetFromUi(); refreshEditor(); break;
  }
}

document.addEventListener('input', onFieldInput);
document.addEventListener('change', function (e) {
  // select / checkbox 的 change 事件也要走同一套草稿写入
  onFieldInput(e);
});

function isValidTzClient(z) {
  if (!z) return false;
  try { new Intl.DateTimeFormat('en-US', { timeZone: z }); return true; } catch (e) { return false; }
}

/* =====================================================================
   启动
   ===================================================================== */

window.addEventListener('hashchange', function () {
  const r = (location.hash || '').replace(/^#\/?/, '') || 'dash';
  if (r !== S.route) gotoRoute(r);
});

/** 合法路由 = 侧边栏那几项 + 管理控制台（它不在导航里，见 viewAdmin 的说明） */
function isKnownRoute(r) {
  return r === 'admin' || NAV.some(function (n) { return n.id === r; });
}

(async function boot() {
  document.documentElement.lang = S.locale;
  const route = (location.hash || '').replace(/^#\/?/, '') || 'dash';
  S.route = isKnownRoute(route) ? route : 'dash';

  if (S.route === 'admin') {
    await loadAdmin().catch(function () {});
    render();
    // 管理页不需要用户会话，拿到早退出的机会
    return;
  }

  try {
    await loadSession();
    if (S.session.authenticated) await loadAll();
  } catch (e) {
    S.session = { authenticated: false, error: e.message };
  }
  render();

  if (S.session && S.session.authenticated) {
    if (S.route === 'logs') await loadLogs().catch(function () {});
    if (S.route === 'dash' || S.route === 'preview') await loadPreview().catch(function () {});
    render();
  }
})();

</script>
